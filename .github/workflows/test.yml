name: Test
on:
  push: { branches: [ "master" ] }
  pull_request: { branches: [ "master" ] }

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-gmpxxyy:
    runs-on: "${{ matrix.on }}"
    strategy:
      matrix:
        on: [ ubuntu-24.04, macos-15, macos-15-intel ]
        environment: [ python-310, python-311, python-312 ]
        target:
          - test
        include:
          - on: ubuntu-24.04
            environment: dev
            target: test-valgrind
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: install valgrind and libc debug symbols
        run: sudo apt install libc6-dbg valgrind
        if: ${{ matrix.target == 'test-valgrind' }}
      - uses: prefix-dev/setup-pixi@v0.8.4
        with:
          pixi-version: v0.61.0
          environments: ${{ matrix.environment }}
      - run: |
          pixi run -e ${{ matrix.environment }} ${{ matrix.target }}
      - uses: flatsurf/actions/show-logs@main
        if: ${{ always() }}
